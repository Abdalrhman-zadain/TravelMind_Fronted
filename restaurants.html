<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelMind — Restaurants</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/restaurants.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body class="has-chatbot-box">
    <!-- ── NAVBAR ── -->
    <nav class="navbar" id="navbar">
      <a href="index.html" class="nav-logo">Travel<span>Mind</span></a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li>
          <a href="attractions.html" data-i18n="nav.attractions">Attractions</a>
        </li>
        <li><a href="hotels.html" data-i18n="nav.hotels">Hotels</a></li>
        <li>
          <a href="restaurants.html" class="active" data-i18n="nav.restaurants"
            >Restaurants</a
          >
        </li>
        <li>
          <a href="trip-planner.html" data-i18n="nav.tripPlanner"
            >Trip Planner</a
          >
        </li>
      </ul>
      <div class="nav-actions" id="nav-actions">
        <button
          class="btn-lang"
          onclick="toggleLanguage()"
          title="Switch Language"
        >
          <span id="lang-label">عربي</span>
        </button>
        <button
          class="btn btn-ghost btn-sm"
          onclick="location.href = 'auth.html'"
        >
          Login
        </button>
        <button
          class="btn btn-primary btn-sm"
          onclick="location.href = 'auth.html'"
        >
          Register
        </button>
      </div>
    </nav>

    <!-- ── PAGE HEADER ── -->
    <div class="page-header">
      <div class="page-header-tag">🍽️ Dining</div>
      <h1>Discover <em>Restaurants</em></h1>
      <p>
        From traditional Jordanian mansaf to international cuisine — find the
        best dining experiences across Jordan.
      </p>
    </div>

    <!-- ── FILTER BAR ── -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" onclick="filterByCity(this, '')">
        All Cities
      </button>
      <button class="filter-btn" onclick="filterByCity(this, 'Amman')">
        🏙️ Amman
      </button>
      <button class="filter-btn" onclick="filterByCity(this, 'Petra')">
        🏛️ Petra
      </button>
      <button class="filter-btn" onclick="filterByCity(this, 'Aqaba')">
        🌊 Aqaba
      </button>
      <button class="filter-btn" onclick="filterByCity(this, 'Wadi Rum')">
        🏜️ Wadi Rum
      </button>
      <span class="filter-divider">|</span>
      <button class="filter-btn" onclick="filterByCuisine(this, 'Arabic')">
        🥙 Arabic
      </button>
      <button class="filter-btn" onclick="filterByCuisine(this, 'Italian')">
        🍕 Italian
      </button>
      <button class="filter-btn" onclick="filterByCuisine(this, 'Fast Food')">
        🍔 Fast Food
      </button>
      <div class="filter-search">
        <input
          type="text"
          id="search-input"
          placeholder="Search restaurants..."
          oninput="filterBySearch(this.value)"
        />
      </div>
    </div>

    <!-- ── MAIN CONTENT ── -->
    <section class="section">
      <div class="results-info">
        <span id="results-count">Loading...</span>
        <div class="view-toggle">
          <button
            class="view-btn active"
            id="view-grid-btn"
            onclick="setView('grid')"
            title="Grid View"
          >
            ▦
          </button>
          <button
            class="view-btn"
            id="view-map-btn"
            onclick="setView('map')"
            title="Map View"
          >
            🗺️
          </button>
        </div>
      </div>
      <div class="grid-3" id="restaurants-grid">
        <div class="loading" style="grid-column: 1/-1">
          <div class="spinner"></div>
          Loading restaurants...
        </div>
      </div>
      <div id="map-container" class="map-container hidden">
        <div
          id="restaurants-map"
          style="width: 100%; height: 500px; border-radius: 12px"
        ></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </section>

    <!-- ── DETAIL MODAL ── -->
    <div class="modal-overlay" id="detail-modal">
      <div class="modal modal-large">
        <div class="modal-header">
          <h3 class="modal-title" id="modal-title">Restaurant Details</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toast-container"></div>

    <a href="chatbot.html" class="chatbot-box" aria-label="Open AI Chatbot">
      <span class="chatbot-box-label" data-i18n="nav.chatbot">AI Chatbot</span>
    </a>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="js/restaurants.js"></script>
  </body>
</html>
