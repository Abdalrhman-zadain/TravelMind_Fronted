<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelMind - Account</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/account.css" />
  </head>
  <body class="has-chatbot-box account-page">
    <nav class="navbar" id="navbar">
      <a href="index.html" class="nav-logo">Travel<span>Mind</span></a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="attractions.html" data-i18n="nav.attractions">Attractions</a></li>
        <li><a href="hotels.html" data-i18n="nav.hotels">Hotels</a></li>
        <li><a href="restaurants.html" data-i18n="nav.restaurants">Restaurants</a></li>
        <li><a href="gallery.html" data-i18n="nav.gallery">Gallery</a></li>
        <li><a href="trip-planner.html" data-i18n="nav.tripPlanner">Trip Planner</a></li>
      </ul>
      <div class="nav-actions" id="nav-actions">
        <button class="btn-lang" onclick="toggleLanguage()" title="Switch Language">
          <span id="lang-label">Arabic</span>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="location.href = 'auth.html'">Login</button>
        <button class="btn btn-primary btn-sm" onclick="location.href = 'auth.html'">Register</button>
      </div>
    </nav>

    <header class="account-hero">
      <div class="page-header-tag">My Account</div>
      <h1>Your TravelMind <em>Dashboard</em></h1>
      <p>Manage your profile, travel preferences, bookings, trips, and reviews in one place.</p>
    </header>

    <main class="account-shell" id="account-shell">
      <div class="loading-state">
        <div class="spinner"></div>
        <span>Loading your account...</span>
      </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <a href="chatbot.html" class="chatbot-box" aria-label="Open AI Chatbot">
      <span class="chatbot-box-label" data-i18n="nav.chatbot">AI Chatbot</span>
    </a>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/trip-sync.js"></script>
    <script src="js/booking-sync.js"></script>
    <script src="js/reviews-sync.js"></script>
    <script src="js/traveler-stories-data.js"></script>
    <script src="js/account.js"></script>
  </body>
</html>
